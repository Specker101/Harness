# Harness-Konfiguration (MVP, P0-P3)
# Aenderungen hier sind "die eine Wahrheit" fuer Grenzen, Pfade und Profile.

[paths]
root        = "g:/Harness/harness"
decomp      = "g:/Silent Scope Decomp"
# Option 3 (2026-09-26): die Schluesseldateien liegen NICHT mehr im Harness-Ordner,
# sondern im Benutzerprofil mit einer ACL nur fuer diesen Benutzer. Grund: der Worker
# hat PowerShell und lief als derselbe Windows-Benutzer - ein Pfadverbot der Werkzeuge
# schliesst ihn nicht (gemessen, docs/_ask_zugriff_regeln.txt). Umzug und Rechte:
#   python -u tools/setup_secrets.py      Beleg: docs/_secrets_umzug.txt
# `$USERPROFILE` wird von hx/config.py aufgeloest, damit der Workspace kopierbar bleibt.
secrets     = "$USERPROFILE/.hx-secrets"
prompts     = "g:/Harness/harness/prompts"
backups     = "g:/Harness/backups"
# R13o: der Ordner UEBER dem Harness - Lese-Wurzel fuer /ask (Belege in docs/,
# Sitzungsprotokolle, Sandbox). Fehlt der Schluessel, nimmt der Code den Elternordner
# von `root`; gesperrt bleiben darin secrets/, backups/ und .credentials.json.
harness_home = "g:/Harness"
# Nur fuer den Umgebungs-Nachweis (R16): der Testlauf darf NICHT ins Decomp-Repo.
sandbox     = "g:/Harness/sandbox/workspace"

[claude]
exe                 = "C:/Users/Benji/.local/bin/claude.exe"
model_worker        = "deepseek-flash[1m]"
# R11-5: der Reviewer laeuft mit Opus 5.5 und Reasoning-Stufe high (kein max).
model_reviewer      = "claude-opus-5-5"
reviewer_effort     = "high"
base_url            = "https://api.deepseek.com/anthropic"
config_dir_worker   = "g:/Harness/harness/cc-worker"
config_dir_reviewer = "g:/Harness/harness/cc-reviewer"
# Nur ein grobes Sicherheitsnetz - die echten Grenzen sind [limits] (E6).
max_turns_safety    = 800
# R13ac: die Batch-Uhr als PostToolUse-Hook in die Worker-Sitzung haengen
# (`--settings runs/b<N>/worker-hooks.json`). Die Zeile nennt nach JEDEM Werkzeugaufruf
# die gemessenen Minuten seit dem Prozessstart (Befund M210-1: der Worker schaetzte
# 180 min, gemessen waren 46). `false` schaltet sie ab, ohne die Vorspann-Regel zu
# entfernen. Gemessen wirksam: tools/r13ac_probe_hook.py, docs/_r13ac_hook.txt.
worker_hooks        = true

[limits]
# ALARM = Telegram-Hinweis, Lauf geht weiter. HARD = Prozess wird beendet.
# R13p (2026-09-27): Alarm 250 -> 500. Gemessen ueber alle Batches braucht ein
# normaler Lauf 84..347 Anfragen (b176 = 347) - bei 250 klingelte der Alarm fast
# immer. ZWINGEND mitgezogen: die harte Grenze 400 -> 1000, sonst toetet sie den
# Batch, BEVOR der Alarm erscheinen kann (und 400 lag nur 53 ueber dem Maximum).
alarm_wall_s      = 5400      # 90 min - EINE Zeitquelle (R13ad)
alarm_requests    = 500
alarm_cost_usd    = 1.0
hard_wall_s       = 10800     # 3 h
hard_requests     = 1000
hard_cost_usd     = 2.0
daily_budget_usd  = 10.0
reviewer_wall_s   = 900
reviewer_alarm_s  = 600

# R13ad (Auftrag 2026-09-29): die Umschaltschwelle liegt `umschalt_vor_alarm_s` Sekunden
# VOR der Alarmgrenze. Ab hier arbeitet der Worker die Nachrueckliste ab bzw. streicht
# (nur mit Uhrnachweis). Bis B212 schrieb der Reviewer stattdessen eigene Zahlen
# ("Budget 80 min", "ab 70 min") in den Auftrag - die standen in keiner Config und
# widersprachen der Batch-Uhr (90 min).
# R13ae (2026-09-29): 600 -> 900 s, also 5400 - 900 = 4500 s = **75 min**. Grund
# (gemessen): der Preflight dauert selbst ~10 min (B213: 602 s Werkzeugzeit), danach
# kommen noch Bilanz und Memory-Export; bei 80 min lief deshalb jeder volle Batch ueber
# den 90-min-Alarm hinaus (B213: 104 min).
umschalt_vor_alarm_s = 900
# Kontextgrenze des Worker-Modells (deepseek-flash[1m]: 1M Kontext, 384k Ausgabe). Die
# Batch-Uhr zeigt "Kontext <x>k von 1M"; der Fortsetzungsanstoss bricht bei
# `kontext_schwelle` ab, damit die Fortsetzung nicht in eine Zwangskompaktierung laeuft.
kontext_limit        = 1000000
kontext_schwelle     = 550000
# So oft darf ein frueh beendeter Lauf im SELBEN Chat fortgesetzt werden (R13ad).
max_fortsetzungen    = 2

[peak]
# R5b: in Peak-Zeiten keine NEUEN Batches starten (laufender Batch darf fertig werden).
block_new_batches   = true
# Chinesische Feiertage sind laut Preisseite off-peak; nicht ableitbar -> Liste.
extra_offpeak_dates = []

[reviewer]
rotation_after = 10

[ask]
# R13o: Gedaechtnis des Frage-Chats (/ask). Der Chat wird wiederverwendet, solange
# KEINE der drei Grenzen reisst - sonst beginnt eine neue Session. Jede Fortsetzung
# (`--resume`) schickt den bisherigen Chat erneut mit: laenger = teurer.
fenster_min   = 30    # so lange ohne Frage darf der Chat weiterlaufen
max_fragen    = 10    # danach beginnt ein neuer Chat
max_alter_min = 120   # Gesamtalter, danach beginnt ein neuer Chat
# Werkzeugrunden je Frage. Eine Runde = ein Werkzeugaufruf; 25 Runden reichen fuer
# ein paar Dateien. Wenn Antworten abgeschnitten wirken, hier auf 40 heben.
max_turns     = 25

[meta]
# R13w (2026-09-28): Aussensicht - der Meta-Review. Eigener Auftrag als der Reviewer:
# "stimmen Messgroessen, Plan und Annahmen noch?" Sie entscheidet und aendert NICHTS;
# sie liefert Befunde (Empfaenger Reviewer -> /claude-Queue, Nutzer -> Telegram+fragen).
# Laeuft immer in einer FRISCHEN Session mit dem Reviewer-Modell (Abo-Kontingent).
# R13z (2026-09-28): 10 -> 3. VORLAEUFIG - Grund und Auswertung stehen in
# docs/bedienung.md Paragraph 12e: es laeuft ein NEUER B-Strang, in dem Plan-Annahmen
# schneller kippen als alle 10 Batches; nach einer Woche wird anhand der Quote in
# state/meta_befunde.json entschieden, ob es bei 3 bleibt (`/bilanz` zeigt sie:
# "Aussensicht: n Befunde, davon u uebernommen, a abgelehnt, o offen").
every_batches    = 3     # zusaetzlich automatisch alle N Batches (erste loest /meta aus)
wall_s           = 900   # harte Zeitgrenze je Lauf (danach bricht der Lauf ab)
max_turns        = 30    # Werkzeugrunden; Stichproben brauchen mehr als ein Review
max_befunde      = 7     # mehr wird nicht in den Ledger uebernommen
summaries        = 10    # so viele Review-Zusammenfassungen gehen in den Prompt
bilanz_zeitfenster = 12  # so viele Batches umfasst der Bilanz-Trend
# R13ad-Nachtrag (2026-09-29): der B-Schritt gilt erst dann als stehengeblieben, wenn so
# viele B-Batch-Reviews IN FOLGE denselben Schritt zeigen. Vorher waren es fest zwei - bei
# 5 Schritten und einem Budget von 10-20 B-Batches ist ein einzelnes Wiederholungspaar
# noch kein Stillstand.
bschritt_stillstand_batches = 3

[git]
push_after_batch = true
remote           = "origin"
branch           = "main"
# R11-1: JEDER git-Aufruf hat ein Zeitlimit und laeuft nicht interaktiv
# (GIT_TERMINAL_PROMPT=0, GCM_INTERACTIVE=never) - kein Warten auf Zugangsdaten.
timeout_s       = 120
fetch_timeout_s = 180
push_timeout_s  = 180

[env]
# R11-3: PATH der Kindprozesse = geerbte Nutzerumgebung + diese Zusaetze VORN.
# "$MSYS_UCRT64" wird gesucht wie in scripts/port_build.ps1 (R310), damit
# `g++ --version` 16.2.0 zeigt (Stand B158) und nicht MinGW.org 6.3.0.
path_prepend = ["$MSYS_UCRT64"]
path_append  = []

[ghidra]
port            = 8089
program_default = "/830d01.27p.main.bin"
server_script   = "g:/Silent Scope Decomp/scripts/start-ghidra-headless.ps1"
# R13e (gemessen 2026-09-26): KEIN --lazy mehr. Mit --lazy laedt die Bridge nur die
# Gruppen aus dem Profil (bzw. bridge_groups): 97 von 215 Werkzeugen. Vom erlaubten
# Satz des Profils ghidra-standard (148) waren damit 76 unsichtbar - u. a.
# get_xrefs_to, get_function_callers/-callees, search_instructions (R224),
# get_function_pcode, list_data_types, get_struct_layout. Nachladen ginge nur mit
# search_tools/load_tool_group - und die sind absichtlich gesperrt, also fiel der
# Worker auf HTTP aus (B162: 18 HTTP-Zeilen). Die Bridge nennt --lazy selbst
# "not recommended for Claude Code" (bridge_mcp_ghidra/cli.py:128).
# Ohne --lazy laedt sie ALLE Gruppen; es entscheiden allein allowed/denied.
bridge_exe      = "g:/Silent Scope Decomp/tools/bridge-venv/Scripts/bridge-mcp-ghidra.exe"
bridge_args     = []
# Nur im Lazy-Modus wirksam (dann aus dem Profil: profile.groups).
bridge_groups   = "listing,function,program,comment"
backup_dir      = "g:/Harness/backups/ghidra"
backup_keep     = 5
start_timeout_s = 300

[telegram]
# Leer = Bot ignoriert alles. Wird erst nach ausdruecklicher Bestaetigung gefuellt.
allowlist_user_ids = ["47190682"]
poll_timeout_s     = 25

[mock]
# true = Attrappen statt echter API-Aufrufe (Testmodus, keine Kosten)
enabled = false
